x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'bionicpro_airflow_secret'
    AIRFLOW_CONN_POSTGRES_SOURCE: 'postgresql://airflow:airflow@postgres:5432/bionicpro'
    AIRFLOW_INPUT_DIR: '/opt/airflow/sample_files'
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: '8123'
    CLICKHOUSE_DATABASE: reports
    CLICKHOUSE_USER: reports
    CLICKHOUSE_PASSWORD: reports_password
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/sample_files
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
  networks:
    - reports

services:
  postgres:
    image: postgres:16.0
    volumes:
      - ./db/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - airflow
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - reports

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\"" ]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-triggerer:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-cli:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - debug
    command:
      - bash
      - -c
      - airflow

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c " airflow db migrate && airflow users create \
      --username admin \
      --firstname admin \
      --lastname admin \
      --role Admin \
      --email admin@bionicpro.ru \
      --password admin \
      && airflow dags unpause bionicpro_reports_etl"
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: reports_password
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - reports

  reports-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_DATABASE: reports
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: reports_password
      KEYCLOAK_ISSUER: http://localhost:8080/realms/reports-realm
      KEYCLOAK_JWKS_URL: http://host.docker.internal:8080/realms/reports-realm/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - clickhouse
    networks:
      - reports

networks:
  reports:
